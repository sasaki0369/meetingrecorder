<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会議メモ記録</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1A5276">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6EE;
    --navy: #23324A;
    --navy-soft: #3B4C6B;
    --terracotta: #C1613B;
    --terracotta-soft: #E8C9B8;
    --gray-border: #DDD5C4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    font-family: "Zen Kaku Gothic New", sans-serif;
    color: var(--navy);
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  .container { width: 100%; max-width: 640px; }
  h1 {
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 1.6rem;
    text-align: center;
    margin: 8px 0 24px;
    letter-spacing: 0.02em;
  }
  .card {
    background: #fff;
    border: 1px solid var(--gray-border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(35,50,74,0.06);
  }
  .center { text-align: center; }
  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
    width: 100%;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-terracotta { background: var(--terracotta); color: #fff; }
  .btn-outline {
    background: #fff;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .btn-small {
    width: auto;
    padding: 8px 14px;
    font-size: 0.85rem;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row button { flex: 1; }
  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .status-recording { background: var(--terracotta-soft); color: var(--terracotta); }
  .status-idle { background: #EEE; color: #777; }
  .event-title { font-size: 1.15rem; font-weight: 700; margin: 4px 0 12px; }
  .time-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--navy-soft); padding: 4px 0; }
  .time-row span:first-child { color: #999; }
  .divider { height: 1px; background: var(--gray-border); margin: 14px 0; }
  .muted { color: #888; font-size: 0.9rem; }
  .email-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.85rem; color: var(--navy-soft); margin-bottom: 16px;
  }
  .link-btn {
    background: none; border: none; color: var(--terracotta);
    font-size: 0.85rem; font-weight: 700; padding: 4px 8px; width: auto;
  }
  #errorBox {
    background: #FBE7E4; color: #9A3B2E; border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; display: none;
  }
  .section-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; }
  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tab-btn {
    flex: 1;
    background: #fff;
    color: var(--navy-soft);
    border: 1px solid var(--gray-border);
    border-radius: 12px;
    padding: 10px;
    font-size: 0.9rem;
  }
  .tab-btn-active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .scheduled-item {
    border: 1px solid var(--gray-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .scheduled-item .info { min-width: 0; margin-bottom: 8px; }
  .scheduled-item .title {
    font-weight: 700; font-size: 0.95rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .scheduled-item .time { font-size: 0.8rem; color: var(--navy-soft); margin-top: 2px; }
  .scheduled-item .btn-row button { background: var(--navy); color: #fff; }
  .scheduled-item .btn-row .memo-btn { background: #fff; color: var(--navy); border: 1px solid var(--navy); }

  /* メモ編集フォーム */
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.85rem; font-weight: 700;
    color: var(--navy-soft); margin-bottom: 4px;
  }
  .field input[type="text"],
  .field input[type="datetime-local"],
  .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border: 1px solid var(--gray-border);
    border-radius: 10px;
    background: var(--cream);
    color: var(--navy);
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field textarea.tall { min-height: 120px; overflow-y: hidden; }

  /* メモ一覧 */
  .note-item {
    border: 1px solid var(--gray-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .note-item:hover { background: var(--cream); }
  .note-item .title { font-weight: 700; font-size: 0.95rem; }
  .note-item .meta { font-size: 0.8rem; color: var(--navy-soft); margin-top: 2px; }
  .note-item .snippet {
    font-size: 0.82rem; color: #777; margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>会議メモ記録</h1>

    <div id="errorBox"></div>

    <div id="loginView" class="card center">
      <p class="muted">Googleアカウントでログインしてください。</p>
      <button id="loginBtn" class="btn-primary">Googleでログイン</button>
    </div>

    <div id="appView" style="display:none;">
      <div class="email-row">
        <span id="emailLabel"></span>
        <button id="logoutBtn" class="link-btn">ログアウト</button>
      </div>

      <button id="startAdHocBtn" class="btn-terracotta" style="margin-bottom:16px;">
        会議開始（予定にない会議）
      </button>

      <div class="card" id="statusCard">
        <div id="statusBadge" class="status-badge status-idle">待機中</div>
        <div id="idleMessage" class="muted">現在進行中の会議はありません。</div>

        <div id="recordingDetail" style="display:none;">
          <div class="event-title" id="eventTitle"></div>
          <div class="time-row"><span>予定</span><span id="scheduledRange"></span></div>
          <div class="time-row"><span>実際の開始</span><span id="actualStart"></span></div>
          <div class="time-row"><span>現在の終了予定</span><span id="currentEndTarget"></span></div>

          <div class="divider"></div>

          <button id="endBtn" class="btn-terracotta">終了</button>
          <div class="btn-row">
            <button id="extend5Btn" class="btn-outline">5分延長</button>
            <button id="extend10Btn" class="btn-outline">10分延長</button>
          </div>
          <div class="btn-row">
            <button id="memoCurrentBtn" class="btn-outline">この会議のメモを書く</button>
          </div>
        </div>
      </div>

      <!-- ─────────────────────────────────────────── -->
      <!-- メモ編集フォーム：会議終了ボタンを押しやすいよう、当該会議（録音状態カード）の
           すぐ下に配置する。予定済み会議から開いた場合もここに表示される。 -->
      <!-- ─────────────────────────────────────────── -->
      <div class="card" id="noteEditorCard" style="display:none;">
        <div class="section-title" id="noteEditorTitle">会議メモ</div>

        <div class="field">
          <label>日時</label>
          <input type="datetime-local" id="noteDatetime">
        </div>
        <div class="field">
          <label>会議名・タイトル</label>
          <input type="text" id="noteEventTitle" placeholder="例：〇〇株式会社 定例MTG">
        </div>
        <div class="field">
          <label>場所</label>
          <input type="text" id="noteLocation" placeholder="例：オンライン（Google Meet）、〇〇会議室 等">
        </div>
        <div class="field">
          <label>参加者</label>
          <input type="text" id="noteParticipants" placeholder="例：自社: 佐々木 / 先方: 山田様、鈴木様">
        </div>
        <div class="field">
          <label>相手の特徴</label>
          <textarea id="noteCounterpart" placeholder="人柄・立場・関心事など"></textarea>
        </div>
        <div class="field">
          <label>会議の終了条件</label>
          <textarea id="notePurpose" placeholder="何が決まれば/確認できれば会議を終えられるか"></textarea>
        </div>
        <div class="field">
          <label>決定事項</label>
          <textarea id="noteDecisions"></textarea>
        </div>
        <div class="field">
          <label>今後の進め方</label>
          <textarea id="noteNextSteps"></textarea>
        </div>
        <div class="field">
          <label>議事メモ</label>
          <textarea id="noteMinutes" class="tall" placeholder="会議中の発言・気づきなどを自由に記録"></textarea>
        </div>
        <div class="field">
          <label>次回への課題</label>
          <textarea id="noteChallenges"></textarea>
        </div>
        <div class="field">
          <label>AI要約</label>
          <textarea id="noteAiSummary" class="tall" placeholder="Androidアプリで生成したClaude要約が自動的に入ります（編集も可能）"></textarea>
        </div>

        <div class="btn-row">
          <button id="noteSaveBtn" class="btn-primary">保存</button>
          <button id="noteCancelBtn" class="btn-outline">閉じる</button>
        </div>
        <button id="noteDeleteBtn" class="btn-outline" style="margin-top:10px; color:#9A3B2E; border-color:#9A3B2E;">
          このメモを削除
        </button>
        <p class="muted center" id="noteSavedLabel" style="margin-top:8px; display:none;">保存しました</p>
      </div>

      <p class="muted center" id="lastUpdated"></p>

      <div class="tab-row">
        <button id="tabScheduledBtn" class="tab-btn tab-btn-active">予定済みの会議</button>
        <button id="tabNotesBtn" class="tab-btn">保存済みのメモ</button>
      </div>

      <div class="card" id="scheduledCard">
        <div class="section-title">予定済みの会議</div>
        <div id="scheduledEmpty" class="muted">現在、開始待ちの予定はありません。</div>
        <div id="scheduledList"></div>
      </div>

      <div class="card" id="notesListCard" style="display:none;">
        <div class="section-title">保存済みのメモ</div>
        <button id="newNoteBtn" class="btn-outline" style="margin-bottom:14px;">新規メモを作成</button>
        <div id="notesEmpty" class="muted">まだメモはありません。</div>
        <div id="notesList"></div>
      </div>
    </div>
  </div>

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
    getRedirectResult, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getDatabase, ref, onValue, push, set, get, remove, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAxVn7JUuoBsNeSODksNYyEkd2W2E252_c",
    authDomain: "life--log.firebaseapp.com",
    databaseURL: "https://life--log-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "life--log",
    storageBucket: "life--log.firebasestorage.app",
    messagingSenderId: "790653257684",
    appId: "1:790653257684:web:c751d762e8fe2c078f3841"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  const $ = (id) => document.getElementById(id);

  // 「議事メモ」欄は、入力量が増えるにつれて枠内スクロールではなく、
  // 欄自体の高さが伸びていくようにする（一度縮めてから内容に合わせて広げ直す）。
  function autoResizeTextarea(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  $("noteMinutes").addEventListener("input", () => autoResizeTextarea($("noteMinutes")));

  function showError(message) {
    const box = $("errorBox");
    box.textContent = message;
    box.style.display = "block";
  }
  function clearError() {
    $("errorBox").style.display = "none";
  }

  // ─────────────────────────────────────────────────────────
  // ログイン
  // ─────────────────────────────────────────────────────────
  $("loginBtn").addEventListener("click", async () => {
    clearError();
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.warn("signInWithPopup failed, falling back to redirect", e);
      try {
        await signInWithRedirect(auth, provider);
      } catch (e2) {
        showError("ログインに失敗しました: " + e2.message);
      }
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
  });

  getRedirectResult(auth).catch((e) => {
    if (e && e.code && e.code !== "auth/no-auth-event") {
      showError("ログインに失敗しました: " + e.message);
    }
  });

  let statusUnsubscribe = null;
  let scheduledUnsubscribe = null;
  let notesUnsubscribe = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      $("loginView").style.display = "none";
      $("appView").style.display = "block";
      $("emailLabel").textContent = user.email || "";
      subscribeStatus();
      subscribeScheduled();
      subscribeNotes();
    } else {
      $("loginView").style.display = "block";
      $("appView").style.display = "none";
      [statusUnsubscribe, scheduledUnsubscribe, notesUnsubscribe].forEach((u) => u && u());
      statusUnsubscribe = scheduledUnsubscribe = notesUnsubscribe = null;
    }
  });

  function fmtTime(ms) {
    if (!ms) return "-";
    const d = new Date(ms);
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    const hh = String(d.getHours()).padStart(2, "0");
    const mi = String(d.getMinutes()).padStart(2, "0");
    return `${mm}/${dd} ${hh}:${mi}`;
  }

  // <input type="datetime-local">用（ローカルタイムゾーンのYYYY-MM-DDTHH:mm）
  function toDatetimeLocalValue(ms) {
    const d = new Date(ms);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fromDatetimeLocalValue(value) {
    if (!value) return Date.now();
    const d = new Date(value);
    return d.getTime();
  }

  let currentRecordingId = null;
  let currentStatusData = null;

  // ─────────────────────────────────────────────────────────
  // 現在の録音状態
  // ─────────────────────────────────────────────────────────
  function subscribeStatus() {
    const statusRef = ref(db, "meetingRecorder/status");
    statusUnsubscribe = onValue(
      statusRef,
      (snapshot) => {
        clearError();
        currentStatusData = snapshot.val();
        renderStatus(currentStatusData);
      },
      (error) => {
        showError("データの取得に失敗しました（ログインしているメールアドレスに権限があるか確認してください）: " + error.message);
      }
    );
  }

  function renderStatus(data) {
    const badge = $("statusBadge");
    const idleMsg = $("idleMessage");
    const detail = $("recordingDetail");

    if (!data || data.status !== "recording") {
      badge.textContent = "待機中";
      badge.className = "status-badge status-idle";
      idleMsg.style.display = "block";
      detail.style.display = "none";
      currentRecordingId = null;
      $("lastUpdated").textContent = data && data.updatedAt ? "最終更新: " + fmtTime(data.updatedAt) : "";
      return;
    }

    currentRecordingId = data.recordingId ?? null;
    badge.textContent = "会議中";
    badge.className = "status-badge status-recording";
    idleMsg.style.display = "none";
    detail.style.display = "block";

    $("eventTitle").textContent = data.eventTitle || "（タイトルなし）";
    $("scheduledRange").textContent = `${fmtTime(data.scheduledStart)} 〜 ${fmtTime(data.scheduledEnd)}`;
    $("actualStart").textContent = fmtTime(data.recordingStartedAt);
    $("currentEndTarget").textContent = fmtTime(data.currentEndTarget);
    $("lastUpdated").textContent = data.updatedAt ? "最終更新: " + fmtTime(data.updatedAt) : "";
  }

  async function sendCommand(type, minutes) {
    if (currentRecordingId === null) return;
    const buttons = [$("endBtn"), $("extend5Btn"), $("extend10Btn")];
    buttons.forEach((b) => (b.disabled = true));
    try {
      const commandsRef = ref(db, "meetingRecorder/commands");
      const payload = { type, recordingId: currentRecordingId, requestedAt: serverTimestamp() };
      if (minutes) payload.minutes = minutes;
      await push(commandsRef, payload);
    } catch (e) {
      showError("操作の送信に失敗しました: " + e.message);
    } finally {
      setTimeout(() => buttons.forEach((b) => (b.disabled = false)), 2000);
    }
  }
  $("endBtn").addEventListener("click", () => sendCommand("end"));
  $("extend5Btn").addEventListener("click", () => sendCommand("extend", 5));
  $("extend10Btn").addEventListener("click", () => sendCommand("extend", 10));

  $("startAdHocBtn").addEventListener("click", async () => {
    const btn = $("startAdHocBtn");
    btn.disabled = true;
    try {
      const commandsRef = ref(db, "meetingRecorder/commands");
      await push(commandsRef, { type: "start_adhoc", requestedAt: serverTimestamp() });
    } catch (e) {
      showError("開始の送信に失敗しました: " + e.message);
    } finally {
      setTimeout(() => (btn.disabled = false), 2000);
    }
  });

  // ─────────────────────────────────────────────────────────
  // 予定済みの会議一覧
  // ─────────────────────────────────────────────────────────
  let scheduledData = {};

  function subscribeScheduled() {
    const scheduledRef = ref(db, "meetingRecorder/scheduled");
    scheduledUnsubscribe = onValue(
      scheduledRef,
      (snapshot) => {
        clearError();
        scheduledData = snapshot.val() || {};
        renderScheduled(scheduledData);
      },
      (error) => showError("予定一覧の取得に失敗しました: " + error.message)
    );
  }

  function renderScheduled(data) {
    const listEl = $("scheduledList");
    const emptyEl = $("scheduledEmpty");
    listEl.innerHTML = "";

    const entries = data
      ? Object.entries(data).sort((a, b) => a[1].scheduledStart - b[1].scheduledStart)
      : [];

    if (entries.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    for (const [recordingId, item] of entries) {
      const row = document.createElement("div");
      row.className = "scheduled-item";

      const info = document.createElement("div");
      info.className = "info";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.eventTitle || "（タイトルなし）";
      const time = document.createElement("div");
      time.className = "time";
      time.textContent = `${fmtTime(item.scheduledStart)} 〜 ${fmtTime(item.scheduledEnd)}`;
      info.appendChild(title);
      info.appendChild(time);

      const btnRow = document.createElement("div");
      btnRow.className = "btn-row";

      const startBtn = document.createElement("button");
      startBtn.textContent = "開始";
      startBtn.addEventListener("click", () => startRecording(recordingId, startBtn));

      const memoBtn = document.createElement("button");
      memoBtn.textContent = "メモ";
      memoBtn.className = "memo-btn";
      memoBtn.addEventListener("click", () => openNoteEditor({
        recordingId,
        eventTitle: item.eventTitle,
        defaultDatetime: item.scheduledStart,
        defaultLocation: item.location,
        defaultParticipants: item.participants
      }));

      btnRow.appendChild(startBtn);
      btnRow.appendChild(memoBtn);
      row.appendChild(info);
      row.appendChild(btnRow);
      listEl.appendChild(row);
    }
  }

  async function startRecording(recordingId, buttonEl) {
    buttonEl.disabled = true;
    try {
      const commandsRef = ref(db, "meetingRecorder/commands");
      await push(commandsRef, {
        type: "start",
        recordingId: Number(recordingId),
        requestedAt: serverTimestamp()
      });
    } catch (e) {
      showError("開始の送信に失敗しました: " + e.message);
    } finally {
      setTimeout(() => (buttonEl.disabled = false), 2000);
    }
  }

  $("memoCurrentBtn").addEventListener("click", () => {
    if (!currentStatusData || currentStatusData.status !== "recording") return;
    openNoteEditor({
      recordingId: currentStatusData.recordingId,
      eventTitle: currentStatusData.eventTitle,
      defaultDatetime: currentStatusData.recordingStartedAt || currentStatusData.scheduledStart,
      defaultLocation: currentStatusData.location,
      defaultParticipants: currentStatusData.participants
    });
  });

  // ─────────────────────────────────────────────────────────
  // 会議メモ（Firebase: meetingRecorder/notes/<recordingId>）
  // ─────────────────────────────────────────────────────────
  let notesData = {};
  let editingNoteId = null;
  let editingRecordingId = null; // 保存時に「この会議は録音継続中か」を判定するために保持

  function subscribeNotes() {
    const notesRef = ref(db, "meetingRecorder/notes");
    notesUnsubscribe = onValue(
      notesRef,
      (snapshot) => {
        notesData = snapshot.val() || {};
        renderNotesList(notesData);
      },
      (error) => showError("メモ一覧の取得に失敗しました: " + error.message)
    );
  }

  function renderNotesList(data) {
    const listEl = $("notesList");
    const emptyEl = $("notesEmpty");
    listEl.innerHTML = "";

    const entries = Object.entries(data).sort((a, b) => {
      const at = a[1].datetime || 0;
      const bt = b[1].datetime || 0;
      return bt - at; // 新しい順
    });

    if (entries.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    for (const [noteId, note] of entries) {
      const item = document.createElement("div");
      item.className = "note-item";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = note.eventTitle || "（無題のメモ）";

      const meta = document.createElement("div");
      meta.className = "meta";
      const metaParts = [fmtTime(note.datetime)];
      if (note.location) metaParts.push(note.location);
      meta.textContent = metaParts.join(" ・ ");

      item.appendChild(title);
      item.appendChild(meta);

      if (note.minutes) {
        const snippet = document.createElement("div");
        snippet.className = "snippet";
        snippet.textContent = note.minutes;
        item.appendChild(snippet);
      }

      item.addEventListener("click", () => openNoteEditor({ noteId }));
      listEl.appendChild(item);
    }
  }

  // recordingId, eventTitle, defaultDatetime, defaultLocation, defaultParticipants を指定して開く
  // （新規 or 既存の続き）。既にそのrecordingIdのメモがあれば、その内容を読み込んで編集する
  // （既存メモの内容を優先し、Googleカレンダー由来の値で上書きしない）。
  // noteIdを指定した場合は、メモ一覧からの直接編集（recordingIdに紐づかない場合を含む）。
  async function openNoteEditor({ recordingId, eventTitle, defaultDatetime, defaultLocation, defaultParticipants, noteId } = {}) {
    let id = noteId;
    let existing = null;

    if (!id && recordingId != null) {
      id = "r" + recordingId; // recordingId起点のメモは "r<id>" というキーにする
      existing = notesData[id] || null;
    } else if (id) {
      existing = notesData[id] || null;
    }

    if (!id) {
      // 完全新規（どの会議にも紐づかない）メモ
      id = "note" + Date.now();
    }

    editingNoteId = id;
    // recordingIdが明示されていない場合（メモ一覧からの直接編集等）でも、
    // "r<recordingId>" 形式のキーであれば会議IDを逆算し、録音継続確認の判定に使えるようにする。
    if (recordingId != null) {
      editingRecordingId = recordingId;
    } else if (/^r\d+$/.test(id)) {
      editingRecordingId = Number(id.slice(1));
    } else {
      editingRecordingId = null;
    }

    $("noteEditorTitle").textContent = existing ? "会議メモを編集" : "会議メモを作成";
    $("noteEventTitle").value = existing?.eventTitle ?? eventTitle ?? "";
    $("noteDatetime").value = toDatetimeLocalValue(existing?.datetime ?? defaultDatetime ?? Date.now());
    // 場所・参加者は、既存メモに値があればそれを優先し、無ければGoogleカレンダーの
    // 予定情報（defaultLocation/defaultParticipants）を初期値として使う。
    $("noteLocation").value = existing?.location || defaultLocation || "";
    $("noteParticipants").value = existing?.participants || defaultParticipants || "";
    $("noteCounterpart").value = existing?.counterpart ?? "";
    $("notePurpose").value = existing?.purpose ?? "";
    $("noteDecisions").value = existing?.decisions ?? "";
    $("noteNextSteps").value = existing?.nextSteps ?? "";
    $("noteMinutes").value = existing?.minutes ?? "";
    autoResizeTextarea($("noteMinutes"));
    $("noteChallenges").value = existing?.challenges ?? "";
    $("noteAiSummary").value = existing?.aiSummary ?? "";
    // メモ削除ボタンは、既に保存済みのメモを開いた場合のみ表示する（新規作成時は無意味なため）
    $("noteDeleteBtn").style.display = existing ? "block" : "none";

    $("noteSavedLabel").style.display = "none";
    $("noteEditorCard").style.display = "block";
    // block:"nearest"にすることで、メモ欄がstatusCard（終了ボタン）のすぐ下にある場合、
    // 画面上部から不必要に大きくスクロールせず、終了ボタンが視界に残りやすくする。
    $("noteEditorCard").scrollIntoView({ behavior: "smooth", block: "nearest" });

    // AI要約：既存メモに保存済みの内容があればそれを優先する（編集内容を上書きしないため）。
    // 無ければ、Android側がClaude要約完成時に送信するmeetingRecorder/summaries/<recordingId>を
    // 一度だけ取得して初期値にする（対象会議が分かっている場合のみ）。
    if (!existing?.aiSummary && editingRecordingId != null) {
      try {
        const snap = await get(ref(db, "meetingRecorder/summaries/" + editingRecordingId));
        const summaryText = snap.exists() ? snap.val().summaryText : null;
        // 取得中にユーザーが別のメモを開いていたら上書きしない
        if (summaryText && editingNoteId === id) {
          $("noteAiSummary").value = summaryText;
        }
      } catch (e) {
        // 要約が無い・取得に失敗しても致命的ではないため、エラー表示はしない
        console.warn("AI要約の取得に失敗しました", e);
      }
    }
  }

  $("newNoteBtn").addEventListener("click", () => openNoteEditor({ defaultDatetime: Date.now() }));

  // ─────────────────────────────────────────────────────────
  // タブ切り替え（予定済みの会議 / 保存済みのメモ）
  // ─────────────────────────────────────────────────────────
  function switchTab(tab) {
    const showScheduled = tab === "scheduled";
    $("scheduledCard").style.display = showScheduled ? "block" : "none";
    $("notesListCard").style.display = showScheduled ? "none" : "block";
    $("tabScheduledBtn").classList.toggle("tab-btn-active", showScheduled);
    $("tabNotesBtn").classList.toggle("tab-btn-active", !showScheduled);
  }
  $("tabScheduledBtn").addEventListener("click", () => switchTab("scheduled"));
  $("tabNotesBtn").addEventListener("click", () => switchTab("notes"));

  $("noteCancelBtn").addEventListener("click", () => {
    $("noteEditorCard").style.display = "none";
    editingNoteId = null;
    editingRecordingId = null;
  });

  $("noteSaveBtn").addEventListener("click", async () => {
    if (!editingNoteId) return;
    const btn = $("noteSaveBtn");
    btn.disabled = true;
    try {
      const payload = {
        eventTitle: $("noteEventTitle").value.trim(),
        datetime: fromDatetimeLocalValue($("noteDatetime").value),
        location: $("noteLocation").value.trim(),
        participants: $("noteParticipants").value.trim(),
        counterpart: $("noteCounterpart").value.trim(),
        purpose: $("notePurpose").value.trim(),
        decisions: $("noteDecisions").value.trim(),
        nextSteps: $("noteNextSteps").value.trim(),
        minutes: $("noteMinutes").value.trim(),
        challenges: $("noteChallenges").value.trim(),
        aiSummary: $("noteAiSummary").value.trim(),
        updatedAt: serverTimestamp()
      };
      await set(ref(db, "meetingRecorder/notes/" + editingNoteId), payload);
      $("noteSavedLabel").style.display = "block";
      $("noteDeleteBtn").style.display = "block"; // 新規作成分も保存後は削除できるようにする

      // 対象の会議（recordingIdが分かっている場合）の会議名を、Android側のデータベースにも
      // 反映する。空欄でなければ常に送る（変更が無くても同じ値で上書きするだけなので害はない）。
      if (editingRecordingId != null && payload.eventTitle) {
        try {
          await push(ref(db, "meetingRecorder/commands"), {
            type: "rename",
            recordingId: Number(editingRecordingId),
            newTitle: payload.eventTitle,
            requestedAt: serverTimestamp()
          });
        } catch (e) {
          console.warn("会議名のAndroidへの反映に失敗しました", e);
        }
      }

      // メモを保存した会議が、まさに現在進行中の会議であれば、終了するか確認する
      if (
        editingRecordingId != null &&
        currentRecordingId != null &&
        Number(editingRecordingId) === Number(currentRecordingId) &&
        currentStatusData?.status === "recording"
      ) {
        const shouldStop = confirm(
          "この会議の録音はまだ続いています。録音を停止しますか？"
        );
        if (shouldStop) {
          await sendCommand("end");
        }
      }
    } catch (e) {
      showError("メモの保存に失敗しました: " + e.message);
    } finally {
      btn.disabled = false;
    }
  });

  $("noteDeleteBtn").addEventListener("click", async () => {
    if (!editingNoteId) return;
    const title = $("noteEventTitle").value.trim() || "（無題のメモ）";
    if (!confirm(`「${title}」のメモを削除しますか？この操作は元に戻せません。`)) return;

    const btn = $("noteDeleteBtn");
    btn.disabled = true;
    try {
      await remove(ref(db, "meetingRecorder/notes/" + editingNoteId));
      $("noteEditorCard").style.display = "none";
      editingNoteId = null;
      editingRecordingId = null;
    } catch (e) {
      showError("メモの削除に失敗しました: " + e.message);
    } finally {
      btn.disabled = false;
    }
  });
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => {
        console.warn("Service Worker登録に失敗しました", e);
      });
    });
  }
</script>
</body>
